# Attaches the jars (one per Minecraft version: 26.2 and 26.3) to the GitHub release whenever a release is
# published. Modrinth and CurseForge aren't set up yet; Shopping List's publish.yml shows how to add them.
#
# Runs as three chained jobs: check the tag -> build (reusing build.yml) -> publish.

name: publish

on:
  release:
    types: [published]

# Read-only by default; only the publish job gets write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: check tag matches mod_version
        run: |
          v=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$v" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match mod_version $v in gradle.properties"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download built jars
        uses: actions/download-artifact@v8
        with:
          name: Artifacts
          path: build/libs/

      - name: attach jars to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/libs/huddable-*+26.2.jar build/libs/huddable-*+26.3.jar --clobber --repo "$GITHUB_REPOSITORY"
