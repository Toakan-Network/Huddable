pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'huddable'

// One subproject per Minecraft version; each has its versions in versions/<mc>/gradle.properties.
['26.2', '26.3'].each { mc ->
	include "mc${mc}"
	project(":mc${mc}").projectDir = file("versions/${mc}")
}
